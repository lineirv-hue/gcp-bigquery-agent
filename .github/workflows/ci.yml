name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Integration Tests
    runs-on: [self-hosted]

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      BQ_DATASET_ID: ${{ secrets.BQ_DATASET_ID }}
      GCP_LOCATION: ${{ secrets.GCP_LOCATION }}
      GEMINI_MODEL: gemini-2.0-flash
      VENV: /Users/irvingfarinas/projects/ai_projects/gcp_bigquery_agent/.venv

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: $VENV/bin/pip install -r requirements.txt --quiet

      - name: Authenticate to Google Cloud
        run: gcloud auth application-default print-access-token > /dev/null

      - name: Run DLA integration tests
        run: $VENV/bin/pytest tests/test_dla_tools.py -v --tb=short

      - name: Run DAA integration tests
        run: $VENV/bin/pytest tests/test_daa_tools.py -v --tb=short
