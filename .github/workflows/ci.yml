name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Integration Tests
    runs-on: [self-hosted]

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      BQ_DATASET_ID: ${{ secrets.BQ_DATASET_ID }}
      GCP_LOCATION: ${{ secrets.GCP_LOCATION }}
      GEMINI_MODEL: gemini-2.0-flash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        # The self-hosted runner uses Application Default Credentials
        # already configured via `gcloud auth application-default login`
        # For a remote runner, use: google-github-actions/auth@v2
        run: gcloud auth application-default print-access-token > /dev/null

      - name: Run DLA integration tests
        run: pytest tests/test_dla_tools.py -v --tb=short

      - name: Run DAA integration tests
        run: pytest tests/test_daa_tools.py -v --tb=short
